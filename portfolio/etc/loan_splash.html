            html { scroll-behavior: smooth; }
* { margin: 0; padding: 0; vertical-align: top; box-sizing: border-box; }
body { max-width: 800px; min-width: 320px; margin: 0 auto; font-size: 18px; font-family: 'Paperozi'; font-weight: 500; touch-action: pan-y; }
li { list-style: none; }
a { text-decoration: none; color: #000; }
img { max-width: 100%; border: none; }
p { color: #000; word-break: keep-all; }
select { -webkit-appearance: none; appearance: none; color: #000; background-image: url(img/selct_arrow.png);
background-repeat: no-repeat; background-position: center right 5px;}
textarea {
border: 1px solid #efefef; outline: none; font-family: inherit; font-size: inherit; color: #000;
resize: none; box-sizing: border-box; -webkit-appearance: none; -moz-appearance: none; appearance: none;        
}
button { all: unset; cursor: pointer; padding: 0; margin: 0; font: inherit; color: inherit; }
h1, h2, h3, h4, h5, h6, p { line-height: 120%; letter-spacing: -.05em; color: #000; }





/* snap */


/* 가로 영역 */
.hori_wrap { width: 100%; overflow: hidden; position: relative;
    max-width: 800px;
    min-width: 320px;
    width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    overflow: hidden;
}
.hori_track { display: flex; height: 100%; transition: transform 0.6s ease; }
.hori_track section { min-width: 100%; min-height: 100vh; }

.form_wrap { position: relative; }
.form_wrap form { background: #ffffff8c; padding: 3em 2em; box-shadow: 2px 2px 10px 6px #00000025;
border-radius: .5em; position: relative; }




/* form */
.form_wrap .inner { padding-top: 15%; width: 90%; }
.form_wrap p { color: #000; font-size: 1.4em; }
.form_tit { text-align: center; font-size: 2.2em !important; font-weight: bolder; 
background: #0022A9; color: #ffff00 ; padding: .3em 0;
}
.form_wrap ul li { margin-bottom: 1.5em; }
.form_wrap .form_policy { margin-bottom: 1.5em; display: flex; flex-wrap: wrap; align-items: center; }
.form_wrap .form_policy input { margin-right: 5px; cursor: pointer; }
.form_wrap .form_policy label { cursor: pointer; margin-right: 5px; }
.form_wrap ul li p:first-child { margin-bottom: 5px; font-size: 1.5em; font-weight: 600; }
.form_wrap ul li p:nth-child(2) { font-size: 1em; margin-bottom: .5em; color: #666; }
.form_wrap ul li input, .form_wrap ul li select { padding: .9em .5em; border-radius: 5em; border: 1px solid #e5e5e5; background-color: #fff;
box-shadow: 2px 2px 10px #0000002f;
}
.form_wrap ul li input[type="text"] { width: 100%; box-sizing: border-box; }
.form_wrap .form_tel input, .form_wrap .form_tel select { width: 33.3% !important; }
.form_wrap .form_select02 select { width: 100%; }
.region_wrap .select_box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1%; }
.form_wrap .form_text textarea { width: 100%; height: 80px; border-radius: 5em; }
.form_wrap .form_policy, .form_wrap .form_policy a { font-size: 1em; color: #000; }
.phone { display: flex; align-items: center; gap: 5px; }
.form_wrap button { width: 100%; padding: .4em 0; color: #fff; background: #0022A9; text-align: center;
border-radius: 5em; font-size: 2.5em; font-family: 'Paperozi'; font-weight: 700; border: none; cursor: pointer; }

input[type="radio"] { appearance: none; -webkit-appearance: none; -moz-appearance: none; }
.radio_wrap { display: grid; grid-template-columns: repeat(3,1fr); gap: .5em; }
.radio_box { width: 100%; display: flex; align-items: center; height: 40px; }
.radio_box input[type="radio"] { width: 100%; position: absolute; left: 50%; transform: translateX(-50%); transition: .3s;
padding: 0; height: 40px; z-index: -1; cursor: pointer; }
.radio_box label { position: relative; width: 100%; text-align: center; line-height: 40px; z-index: 1;
color: #666; cursor: pointer; }
.radio_box input[type="radio"]:checked { background: #0022A9; }
.radio_box input[type="radio"]:checked + span { color: #fff; }
#show-Box { cursor: pointer; }
.form_wrap input::placeholder { color: #c5c5c5; }
.form_btm { width: 95%; margin: 0 auto; text-align: center; padding-top: 1em; font-weight: normal; line-height: 150%; }
.form_wrap .no_choice { color: #999 !important; }



.loading_wrap { text-align: center; margin-bottom: 3em; }
.loading_wrap img { width: 13%; margin-bottom: 1em; }
.loading_wrap p { font-size: 1.3em; }
.loading_con { display: flex; justify-content: center; align-items: flex-end; gap: 0.2em; margin-bottom: 1em; }
.loading_box { width: .5em; height: 1em; background: #0022A9; animation: loadingFade 1s infinite ease-in-out; }

/* 각 막대 애니메이션 딜레이 다르게 적용 */
.loading_box:nth-child(1) { animation-delay: 0s; }
.loading_box:nth-child(2) { animation-delay: 0.2s; }
.loading_box:nth-child(3) { animation-delay: 0.4s; }
.loading_box:nth-child(4) { animation-delay: 0.6s; }
.loading_box:nth-child(5) { animation-delay: 0.7s; }
.loading_box:nth-child(6) { animation-delay: .8s; }
.loading_box:nth-child(7) { animation-delay: .9s; }

@keyframes loadingFade {
0%, 100% {
opacity: 0.2; /* 옅음 */
}
50% {
opacity: 1;   /* 진하게 */
}
}


section { min-height: 100vh; background: linear-gradient(#CDF4FF, #9DE9FF, #9DD6FF, #9ABAFF); overflow: hidden; }
.con_btn { display: block; text-align: center; background: #0022A9; color: #fff; margin: 0 auto; padding: .3em 0; font-weight: 700;
width: 90%; font-size: 3.5em; border-radius: .3em; }

.bar { display: flex; width: 90%; margin: 0 auto; gap: .5em; padding-top: 5%; }
.bar div { width: 33.3%; height: .8em; background: #DBDBDB; }

.main_con img:nth-child(2) { top: -10%; right: -30%; }
.main_con img:nth-child(3) { bottom: -5%; left: -25%; }
.main_con img:nth-child(4) { bottom: 15%; right: -25%; }

.main .inner > img { width: 80%; margin: 0 auto; display: block; }


/* con1 */
.con1 .bar div:nth-child(1) { background: #0022A9; }
.con1 .con_tit h2 { font-size: 3.3em; margin-bottom: .3em; }
.con1 .con_tit p, .con2 .con_tit p, .con3 .con_tit p  { font-size: 1.5em; display: inline-block; background: #0022A9; color: #fff; padding: .1em; }
.con1 .inner > img { width: 98%; margin: 0 auto; margin-left: 1%; margin-bottom: 5em; }



/* con2 */

.con2 .bar div:nth-child(1), .con2 .bar div:nth-child(2) { background: #0022A9; }

.con2 .con_tit p { font-size: 2.4em; margin-bottom: .3em; }
.con2 .con_tit h2 { font-size: 3.5em; }

.con2_con { display: flex; align-items: flex-end; justify-content: center; margin-bottom: 10em; }
.con2_con img:first-child { width: 51%; position: relative; z-index: 100; }
.con2_con img:last-child { width: 56%; margin-left: -8%; z-index: 0; }




/* con3 */
.con3 .inner { width: 100%; }
.con3 .bar div { background: #0022A9; }

.con3 .con_tit { margin-bottom: 3.5em; }
.con3 .con_tit p { font-size: 2.7em; margin-bottom: .3em; }
.con3 .con_tit p span { color: #ffff00; }
.con3 .con_tit h3 { font-size: 2.8em; }
.con3 .con_tit h2 { font-size: 3.8em; }


/* splide */
.con3_con { margin-bottom: 3em; }

.splide__pagination, .splide__arrows { display: none; } 
.splide1 { margin-bottom: 1em; }
.splide__list { gap: 1.5em; }
.splide__list img { box-shadow: 2px 2px 5px #00000034; border-radius: .5em; }
.splide__slide { padding: 1em 0; }


.con3_btm { font-size: 3.3em; text-align: center; margin-bottom: 1em; }
.con3_btm .tcolor { font-size: 1.3em; font-weight: 700; display: inline-block; margin-top: .2em; }




/* all */
.con_tit p { font-size: 2em; }
.bg { width: 100%; position: relative; overflow: hidden; }
.bg > img { width: 100%; object-fit: contain; }
.tcolor { color: #0022A9; }
.bg_inner { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 1em; }
.inner { width: 95%; margin: 0 auto; padding: 10% 0; }
h2 { font-size: 2.5em; letter-spacing: 0; font-family: 'Paperozi'; font-weight: 700; }
h3 { font-size: 2em; letter-spacing: -.05em; font-family: 'Paperozi'; font-weight: 700; }
h4, h5, h6 { font-size: 2em; font-family: 'Paperozi'; font-weight: 500; }
.con_tit { text-align: center; margin-bottom: 5em; }
.call { font-size: 1.3em; text-align: center; margin: 2em 0; color: #000; }



/* animation */
.form_wrap button, .con3 button { animation: form_btn 2s infinite forwards; }

@keyframes form_btn {

0% { box-shadow: 0 7px 0 0 #001877; transform: translateY(-7px); box-sizing: border-box; color: #fff000; }
50% { box-shadow: 0 7px 0 0 #001877; transform: translateY(-7px); box-sizing: border-box; color: #fff000;  }
50.01% { box-shadow: none; transform: translateY(0); box-sizing: content-box; color: #fff;  }
100% { box-shadow: none; transform: translateY(0); box-sizing: content-box; color: #fff;  }

}

.form_wrap .main_con img:nth-child(1), .form_wrap .main_con img:nth-child(3) { animation: form_top 2s infinite forwards alternate; }

@keyframes form_top {
0% { transform: rotate(15deg) translate3d(10px, 10px, 10px); }
100% { transform: rotate(-15deg) translate3d(-10px, -10px, -10px); }
}

.form_wrap .main_con img:nth-child(2n) { animation: form_btm 2.5s infinite forwards alternate; }

@keyframes form_btm {
0% { transform: rotate(-20deg) translate3d(-10px, -10px, -10px); }
100% { transform: rotate(20deg) translate3d(10px, 10px, 10px); }
}





/* media screen */

@media screen and (max-width: 600px) {
body { font-size: 15px; }


}



@media screen and (max-width: 480px) {
body { font-size: 10px; }
.radio_box span { font-size: 15px; }   


}

<script>
document.addEventListener('DOMContentLoaded', () => {

    const track = document.querySelector('.hori_track');
    const sections = document.querySelectorAll('.hori_track section');

    let current = 0;
    let lock = false;

    function update() {
        track.style.transform = `translateX(-${current * 100}%)`;
        track.style.transition = 'transform 0.6s ease';
    }

    function move(dir) {
        if (lock) return;

        const next = current + dir;

        if (next < 0 || next >= sections.length) return;

        current = next;
        lock = true;

        update();

        setTimeout(() => lock = false, 600);
    }

    /* 버튼 */
    document.querySelectorAll('.con_btn').forEach(btn => {
        btn.addEventListener('click', () => move(1));
    });

    /* 스플래시 → con1 자동 이동 */
    setTimeout(() => {
        if (current === 0) {
            current = 1;
            update();
            if (typeof AOS !== 'undefined') AOS.refresh();
        }
    }, 3000);

    /* 메인 클릭 시 넘기기 (스킵) */
    const main = document.querySelector('.main');
    if (main) {
        main.addEventListener('click', () => {
            if (current === 0) {
                current = 1;
                update();
            }
        });
    }

    let startX = 0;
    let endX = 0;
    let isSwiping = false;
    const threshold = 50;

    track.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isSwiping = false;
    }, { passive: true });

    track.addEventListener('touchmove', (e) => {
        endX = e.touches[0].clientX;
        if (Math.abs(startX - endX) > 10) {
            isSwiping = true;
        }
    }, { passive: true });

    track.addEventListener('touchend', () => {
        if (!isSwiping) return;

        const diff = startX - endX;
        if (Math.abs(diff) < threshold) return;

        // 🔥 처음 main에서 스와이프하면 바로 con1
        if (current === 0) {
            current = 1;
            update();
            return;
        }

        if (diff > 0) move(1);
        else move(-1);
    });

    document.querySelectorAll('.con_btn').forEach(btn => {
        btn.addEventListener('touchstart', (e) => e.stopPropagation());
    });

});
</script>
