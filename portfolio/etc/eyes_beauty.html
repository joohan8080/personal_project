<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
        <link rel="stylesheet" href="css/web_fonts.css" type="text/css">
        <title>병/의원</title>
        <style>
            html { scroll-behavior: smooth; }
* { margin: 0; padding: 0; vertical-align: top; box-sizing: border-box; }
body { max-width: 800px; min-width: 320px; margin: 0 auto; font-size: 18px; font-family: 'Pretendard-Regular'; font-weight: 500; }
li { list-style: none; }
a { text-decoration: none; color: #333; }
img { max-width: 100%; border: none; }
p { color: #333; word-break: keep-all; }
select { -webkit-appearance: none; appearance: none; color: #333; background-image: url('img/selct_arrow.png');
background-repeat: no-repeat; background-position: center right 5px;}
textarea {
border: 1px solid #efefef; outline: none; font-family: inherit; font-size: inherit; color: #333;
resize: none; box-sizing: border-box; -webkit-appearance: none; -moz-appearance: none; appearance: none;        
}
button { all: unset; cursor: pointer; padding: 0; margin: 0; font: inherit; color: inherit; }
h1, h2, h3, h4, h5, h6, p { line-height: 120%; letter-spacing: -.05em; color: #333; }



/* top_fix */
.top_fix { width: 100%; max-width: 800px; min-width: 320px; position: fixed; bottom: 0; background: #fdadade8; z-index: 9999;
display: flex; justify-content: space-between; align-items: center; padding: 1.5em 1em; box-sizing: border-box; }
.top_fix img { width: 45%; }
.top_fix a { display: block; width: 100%; height: 100%; position: absolute; left: 0; }
.top_fix h4 { font-size: 2em; color: #fff; }

/* form */
.form_wrap { padding: 10% 0 25% 0; background: #fff; }
.form_wrap p { color: #333; font-size: 1.4em; }
.form_tit { text-align: center; margin-bottom: 1.5em; font-size: 2em !important;  line-height: 150%; }
.form_tit .tcolor { color: red; }
.form_wrap .inner { width: 95%; margin: 0 auto; padding: 0; }
.form_wrap ul li { margin-bottom: 1.2em; }
.form_wrap .form_policy { margin-bottom: 2em; display: flex; flex-wrap: wrap; align-items: center; }
.form_wrap .form_policy input { margin-right: 5px; cursor: pointer; }
.form_wrap .form_policy label { cursor: pointer; margin-right: 5px; }
.form_wrap ul li p:first-child { margin-bottom: 5px; font-size: 1.4em; font-weight: 600; }
.form_wrap ul li p:nth-child(2) { font-size: 1.1em; margin-bottom: .7em; color: #666; }
.form_wrap ul li input, .form_wrap ul li select { padding: 1em .5em; border-radius: .3em; border: 1px solid #e5e5e5; background-color: #fff; font-size: 1.2em; }
.form_wrap ul li input[type="text"] { width: 100%; box-sizing: border-box; }
.form_wrap .form_tel input, .form_wrap .form_tel select { width: 32% !important; }
.form_wrap .form_select02 select { width: 100%; }
.region_wrap .select_box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1%; }
.form_wrap .form_text textarea { width: 100%; height: 80px; border-radius: .3em; }
.form_wrap .form_policy, .form_wrap .form_policy a { font-size: 1.2em; color: #333; }
.phone { display: flex; align-items: center; gap: 5px; }
.form_wrap button { width: 100%; padding: .7em 0; color: #fff; background: #FF7474; text-align: center; font-family: 'Pretendard-Bold';
border-radius: 10em; font-size: 2em;  border: none; cursor: pointer; }
input[type="radio"] { appearance: none; -webkit-appearance: none; -moz-appearance: none; }
.radio_wrap { display: flex; gap: 5px; }
.radio_box { width: 100%; display: flex; align-items: center; height: 3em; }
.radio_box input[type="radio"] { width: 100%; position: absolute; left: 50%; transform: translateX(-50%); transition: .3s;
padding: 0; height: 3em; z-index: -1; cursor: pointer; }
.radio_box label { position: relative; width: 100%; text-align: center; line-height: 3em; z-index: 1;
color: #666; cursor: pointer; }
.radio_box input[type="radio"]:checked { background: #fd5f4a; }
.radio_box input[type="radio"]:checked + span { color: #fff; }
#show-Box { cursor: pointer; }
.form_wrap input::placeholder { color: #c5c5c5; }
.form_btm { width: 95%; margin: 0 auto; text-align: center; padding-top: 2em; font-weight: normal; line-height: 150%; }
.form_wrap .no_choice { color: #999 !important; }

.check_box { border: 2px solid #e5e5e5; margin-bottom: .5em; border-radius: .3em; transition: .3s; cursor: pointer; }
.check_box span { font-size: 1em; color: #333; transition: .3s; }
.check_box label { display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 1em .5em;  }
.check_box:last-child { margin-bottom: 0; }
.check_box input[type="checkbox"] {  -webkit-appearance: none; /* Safari, Chrome */ -moz-appearance: none;    /* Firefox */
appearance: none; /* 표준 */ margin: 0; padding: 0;  border: none; outline: none; cursor: pointer; transition: .3s;
width: 1em; height: 1em; aspect-ratio: 1 / 1;   /* 1:1 비율 = 정사각형 */  position: relative; border: 2px solid #e5e5e5;
border-radius: 10em;
} 
.check_box input[type="checkbox"]:checked::before {
content: '✔'; font-size: 1em; color: white; position: absolute; top: 50%; left: 50%;
transform: translateX(-50%) translateY(-50%); }
.check_box input[type="checkbox"]:checked { background-color: #fd5f4a; border-color: #fd5f4a; }

.check_box:has(input[type="checkbox"]:checked) { background: #fd5f4a; }
.check_box input[type="checkbox"]:checked + span { color: #fff; }
input.check_choice:focus { outline: 2px solid #fd5f4a; }

.main_loading { text-align: center; margin-bottom: 2em; }
.main_loading img { width: 6%; margin-bottom: 1.5em; }
.main_loading p { font-size: 1.2em; color: #fd5f4a; }

/* dot 로딩css */
.dot_wrap { display: flex; justify-content: center; margin-bottom: 1.5em; }
.dot { width: 1em; aspect-ratio: 1 / 1;  margin-right: .5em; border-radius: 1em; background-color: #FF7474; animation: pulse 1.5s infinite ease-in-out; }
.dot:last-child { margin-right: 0; }
.dot:nth-child(1) { animation-delay: -0.3s; }
.dot:nth-child(2) { animation-delay: -0.1s; }
.dot:nth-child(3) { animation-delay: 0.1s; }

@keyframes pulse {
0% {
transform: scale(0.8);
background-color: #FF7474;
box-shadow: 0 0 0 0 rgba(252, 178, 212, 0.7);
}

50% {
transform: scale(1.2);
background-color: #FF7474;
box-shadow: 0 0 0 10px rgba(252, 247, 178, 0.027);
}

100% {
transform: scale(0.8);
background-color: #FF7474;
box-shadow: 0 0 0 0 rgba(252, 178, 230, 0.7);
}
}



/* main */
.main .bg_inner { padding: 0; justify-content: flex-end; align-items: flex-end; }
.main .bg_inner > img { width: 85%; margin-right: -1em; margin-bottom: -1em; display: block; }

/* con1 */
.con1 { background: #FF8383; }
.con1 h6, .con1 h4 { color: #fff; }

.con1 .con_tit h6 { font-size: 2.1em; margin-bottom: .3em; }
.con1 .con_tit h4 { font-size: 2.2em; }

.con1 .inner > img { margin-bottom: 2.5em; }

.con1_btm { text-align: center; }
.con1_btm h6 { margin-bottom: .3em; }
.con1_btm h4 { color:#fff000; font-size: 2.7em; }
.con1_btm h4 em { font-style: normal; font-weight: 700; }  

/* con2 */
.con2 .bg_inner { align-items: flex-end; justify-content: space-around; }

.con2 .bg_inner img:first-child { width: 25%; transform: translateY(-7em); }
.con2 .bg_inner img:last-child { width: 15%; transform: translateY(-8em); }





/* con3 */
/* con4 */



/* all */
.con_tit p { font-size: 2.5em; }
.bg { width: 100%; position: relative; overflow: hidden; }
.bg > img { width: 100%; object-fit: contain; }
.tcolor { color: #FF7474; }
.bg_inner { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 1em; }
.inner { width: 95%; margin: 0 auto; padding: 15% 0; }
h2 { font-size: 2em; letter-spacing: -.05em; font-family: 'GMarketSans'; font-weight: 700; }
h3 { font-size: 2em; letter-spacing: -.05em; font-family: 'GMarketSans'; font-weight: 700; }
h4, h5 { font-size: 2em; font-family: 'GMarketSans'; font-weight: 500; }
h6 { font-size: 2em; font-family: 'GMarketSans'; font-weight: 300; }
.con_tit { text-align: center; margin-bottom: 3.5em; }



/* animation */
.form_wrap button { animation: form_btn 2s infinite forwards; }

@keyframes form_btn {
0% { border-bottom: 5px solid #fd5f4a; box-sizing: border-box; color: #FFFF00; margin-top: -5px; }
50% { border-bottom: 5px solid #fd5f4a; box-sizing: border-box; color: #FFFF00; margin-top: -5px; }
50.01% { border-bottom: none; box-sizing: content-box; color: #fff; margin-top: 0; }
100% { border-bottom: none; box-sizing: content-box; color: #fff; margin-top: 0; }
}


.con2 .bg_inner img:first-child { animation: con2_heart01 1s infinite forwards alternate; }

@keyframes con2_heart01 {
0% { transform: rotate(5deg) translateY(-7em); }
100% { transform: rotate(0deg) translateY(-6.5em);  }
}

.con2 .bg_inner img:last-child { animation: con2_heart02 1s infinite forwards alternate; }

@keyframes con2_heart02 {
0% { transform: rotate(-10deg) translateY(-8.5em) translateX(-.5em); }
100% { transform: rotate(0deg) translateY(-8em) translateX(0em); }
}

.top_fix h4  { animation: top_fix_tc 2s infinite forwards; }

@keyframes top_fix_tc {
0% { color: #fff000; }
50% { color: #fff000; }
50.01% { color: #fff; }
100% { color: #fff; }

}

.con1_btm h4 em { animation: con1_btm_tc 2s infinite forwards; }

@keyframes con1_btm_tc {
0% { color: #fff000; }
50% { color: #fff000; }
50.01% { color: #000; }
100% { color: #000; }

}

/* media screen */

@media screen and (max-width: 600px) {
body { font-size: 15px; }


}
@media screen and (max-width: 480px) {
body { font-size: 10px; }
.radio_box span { font-size: 15px; }   


}

     



















        </style>
    </head>

    <body>

            <img src="img/eyes_beauty//logo.png" alt="로고">

        <section class="form_wrap" id="form_wrap-sec">

            <!-- <p class="form_tit"></p> -->

                    <img src="img/eyes_beauty//form_ico.png" alt="자물쇠">

        <script>
            AOS.init({
            once: false,          // 반복 실행
            startEvent: 'load',   // 시작 타이밍
            });
        </script>



        <script>
            // 여러 개 요소 선택
            const openBtns = document.querySelectorAll("#show-Box, #show-Box_top");

            openBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const popup = window.open(
                        'policy.html', // 조약 내용을 담은 실제 경로
                        '개인정보이용동의',
                        'width=800,height=600,scrollbars=yes'
                    );      

                    if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                        alert('팝업 차단이 감지되었습니다! 팝업 허용을 설정해주세요.');
                    }
                });
            });
        </script>
