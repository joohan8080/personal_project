<!DOCTYPE html>

    <head>

        <style>
                        
            :root {
            --main: #8015C7;
            --sub: #9900ff;
            --bg-dark: #0f1115;
            --text-sub: #b5b5b5;
            }


            html { scroll-behavior: smooth; }
            * { margin: 0; padding: 0; }
            body { max-width: 800px; min-width: 320px; margin: 0 auto; font-size: 18px;
            color: #333; font-family: 'Pretendard-Medium'; background-color: #dab5b6; font-weight: 500; word-break: keep-all; letter-spacing: -.05em; }
            li { list-style: none; }

            p { color: #333; word-break: keep-all; }
            select { -webkit-appearance: none; appearance: none; color: #666; background-image: url('img/selct_arrow.png');

            .form_wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.5); left: 50%; transform: translateX(-50%);
            display: none; overflow-y: auto; padding: 5% 0; z-index: 9999; max-width: 800px; width: 100%; backdrop-filter: blur(5px);

            .form_wrap.active { display: block; }

            .radio_box label { position: relative; width: 100%; text-align: center; line-height: 40px; z-index: 1;

            .radio_box input[type="radio"]:checked { background: var(--sub); }

            #show-Box { cursor: pointer; }
            .form_wrap input::placeholder { color: #666; }

            /* media screen */

        </style>

        <script>
            function openPrecheck() {
                document.getElementById("precheckModal").classList.add("active");
                document.body.style.overflow = "hidden";
            }

            function confirmBusiness(isBusiness) {
                const modal = document.getElementById("precheckModal");

                if (!isBusiness) {
                    alert("사업자만 신청 가능합니다.");
                    return;
                }

                modal.classList.remove("active");

                // 2단계 팝업 열기
                document.getElementById("taxModal").classList.add("active");
            }

            function confirmTax(hasDebt) {
                const modal = document.getElementById("taxModal");

                if (hasDebt) {
                    alert("연체중이신 경우 신청이 불가합니다.");
                    return;
                }

                modal.classList.remove("active");

                document.getElementById("form_wrap-sec").classList.add("active");
                document.body.style.overflow = "hidden";
            }

            // precheck 바깥 클릭 닫기
            document.getElementById("precheckModal").addEventListener("click", (e) => {
                if (e.target.id === "precheckModal") {
                    e.currentTarget.classList.remove("active");
                    document.body.style.overflow = "";
                }
            });

            document.getElementById("taxModal").addEventListener("click", (e) => {
                if (e.target.id === "taxModal") {
                    e.currentTarget.classList.remove("active");
                    document.body.style.overflow = "";
                }
            });

            // form 바깥 클릭 닫기
            const formWrap = document.getElementById("form_wrap-sec");

            formWrap.addEventListener("click", (e) => {
                if (e.target === formWrap) {
                    formWrap.classList.remove("active");
                    document.body.style.overflow = "";
                }
            });

            document.querySelectorAll(".close").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.getElementById("form_wrap-sec").classList.remove("active");
                    document.body.style.overflow = "";
                });
            });
            
        </script>







        <script>
        // 팝업 창
        const openPop = document.getElementById("show-Box");
        openPop.addEventListener('click', () => {
            const popup = window.open(

                '개인정보이용동의',
                'width=800,height=600,scrollbars=yes'
            );      

            if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                alert('팝업 차단이 감지되었습니다! 팝업 허용을 설정해주세요.');
            }
        });
     </script>

        <script>
            function openInfo(type) {
                const modal = document.getElementById("infoModal");
                const title = document.getElementById("infoTitle");
                const desc = document.getElementById("infoDesc");
                const img = document.getElementById("infoImg");

                // 기존 클래스 제거 (핵심)
                img.className = "";

                if (type === 1) {
                    title.innerText = "고금리 대출 탈출 방법";
                    desc.innerText = "고금리 대출, 혼자 해결하려 하지 마세요.\n일반대출 금리보다 최대 4배 낮은\n정책자금으로 전환하세요!";
                    img.src = "img/loan_edu/modal03.png";
                    img.classList.add("info_img_1");
                } 
                else if (type === 2) {
                    title.innerText = "정책자금 vs 은행대출";
                    desc.innerText = "정책자금은 일반 대출 대비\n최대 3~4배 낮은 이자로 지원하고 있습니다.";
                    img.src = "img/loan_edu/modal02.png";
                    img.classList.add("info_img_2");
                } 
                else if (type === 3) {
                    title.innerText = "정책자금 자격 조건";
                    desc.innerHTML = "정책자금은 <b>사업자 대상</b>으로 <b>연체&체납이 없고</b><br><b>매출이 발생한 경우</b>, 신청 가능합니다.";
                    img.src = "img/loan_edu/modal01.webp";
                    img.classList.add("info_img_3");
                }

                modal.classList.add("active");
                document.body.style.overflow = "hidden";
            }

            // 닫기
            document.querySelector(".info_close").addEventListener("click", () => {
                document.getElementById("infoModal").classList.remove("active");
                document.body.style.overflow = "";
            });

            // 바깥 클릭 닫기
            document.getElementById("infoModal").addEventListener("click", (e) => {
                if (e.target.id === "infoModal") {
                    e.currentTarget.classList.remove("active");
                    document.body.style.overflow = "";
                }
            });
        </script>
